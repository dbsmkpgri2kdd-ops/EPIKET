 <script>
// ================== CONFIG & INIT ==================
const firebaseConfig = {
  apiKey: "AIzaSyDOkyWxtvVpwir6nbhEB3MNd44Caz_RWJU",
  authDomain: "studio-4448301263-a6cd9.firebaseapp.com",
  projectId: "studio-4448301263-a6cd9",
  storageBucket: "studio-4448301263-a6cd9.firebasestorage.app",
  messagingSenderId: "578574487721",
  appId: "1:578574487721:web:83e30267100d71bd5d59b8"
};

// Path utama sesuai dengan Rule Firestore Anda
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const APP_PATH = "stm-pgri2-kdd-v3";
const BIOMETRIC_PATH = `artifacts/${APP_PATH}/public/biometrics`; 
const SETTINGS_PATH = `artifacts/${APP_PATH}/public/config/settings`;
const ABSENSI_PATH = `artifacts/${APP_PATH}/public/records`;

let siswaData = [], settings = {}, isLocationValid = false;
let faceMatcher = null, lastAttendance = {};
let currentFacingMode = "user", currentStream = null;
let watchId = null, isProcessing = false;
let lastX = 0, lastY = 0; 
let currentTab = 'absensi'; // Tracker tab aktif

const faceOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });
const video = document.getElementById('video');
const logContent = document.getElementById('log-content');
const gpsStatus = document.getElementById('gps-status');

// ================== INITIALIZATION ==================
window.onload = async () => {
    initTheme(); listenToCloudSettings(); await loadModels(); await startVideo();
    startGpsTracking(); initFaceDetection(); loadLaporan(); autoSelectType(); await syncFaceDatabase();
};

async function loadModels() {
    addLog("⏳ Memuat AI...");
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    try {
        // Muat semua model secara bersamaan (Parallel)
        await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        addLog("✅ AI Siap digunakan.");
    } catch (e) { 
        addLog("❌ Gagal memuat AI: " + e.message);
        showToast("Gagal memuat AI. Cek koneksi internet!", "error");
    }
}

// ================== CAMERA & FACE CORE ==================
async function startVideo() {
        try {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: 640, height: 480 }
            });
            video.srcObject = currentStream;
        } catch (e) { addLog("❌ Kamera Error."); }
    }

function switchCamera() {
    currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
    addLog("🔄 Ganti kamera..."); startVideo();
}


const localDB = new Dexie("BioScanDB");
localDB.version(1).stores({
    faces: "nis, nama, kelas, descriptor"
});

// Update fungsi syncFaceDatabase
async function syncFaceDatabase() {
    addLog("🔄 Mengecek Database Wajah...");
    try {
        // 1. Cek jumlah data lokal
        const localCount = await localDB.faces.count();
        
        // 2. Ambil data terbaru dari Firestore
        const snapshot = await db.collection("artifacts").doc(APP_PATH)
                                  .collection("public").doc("biometrics")
                                  .collection("face_data").get();
        
        if (snapshot.size !== localCount) {
            addLog("📥 Mengunduh Data Wajah Baru...");
            const faceDataArray = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                faceDataArray.push({
                    nis: data.nis,
                    nama: data.nama,
                    kelas: data.kelas,
                    descriptor: JSON.parse(data.descriptor)
                });
            });

            await localDB.faces.clear();
            await localDB.faces.bulkPut(faceDataArray);
            addLog(`✅ ${faceDataArray.length} Wajah Tersimpan Lokal.`);
        }

        // 3. Load ke FaceMatcher
        const allFaces = await localDB.faces.toArray();
        const labeled = allFaces.map(f => 
            new faceapi.LabeledFaceDescriptors(f.nis, [new Float32Array(f.descriptor)])
        );

        if (labeled.length > 0) {
            faceMatcher = new faceapi.FaceMatcher(labeled, 0.45);
            addLog("Ready: AI siap mengenali wajah.");
        } else {
            addLog("⚠️ Database Wajah Kosong.");
        }
    } catch (e) {
        addLog("❌ Sync Gagal: " + e.message);
    }
}

// 1. TAMBAHKAN FUNGSI TOAST (WAJIB ADA)
function showToast(msg, type = "info") {
    const toast = document.createElement("div");
    toast.className = `fixed bottom-24 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-white text-xs font-bold shadow-2xl transition-all duration-500 z-[10000] ${
        type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'
    }`;
    toast.innerText = msg.toUpperCase();
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translate(-50%, 20px)";
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}

// 2. PERBAIKAN GPS TRACKING (DENGAN CEK AKURASI)
function startGpsTracking() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    addLog("📡 Memulai GPS akurasi tinggi...");
    
    watchId = navigator.geolocation.watchPosition(p => {
        const { latitude, longitude, accuracy } = p.coords;

        if (!settings.lat || !settings.lng) {
            gpsStatus.innerText = "⚠️ KOORDINAT TARGET BELUM DISET";
            return;
        }

        const dist = calculateDistance(latitude, longitude, settings.lat, settings.lng);
        
        // VALIDASI AKURASI: Jika akurasi > 50 meter, anggap sinyal tidak sah
        if (accuracy > 50) {
            gpsStatus.innerText = `📡 SINYAL LEMAH (${Math.round(accuracy)}m). CARI TEMPAT TERBUKA!`;
            gpsStatus.className = "bg-orange-500 text-white p-2 rounded-lg text-[10px] font-bold";
            isLocationValid = false;
        } else {
            isLocationValid = dist <= (settings.radius || 30);
            if (isLocationValid) {
                gpsStatus.innerText = `📍 AREA SEKOLAH (Jarak: ${Math.round(dist)}m | Akurasi: ${Math.round(accuracy)}m)`;
                gpsStatus.className = "bg-green-600 text-white p-2 rounded-lg text-[10px] font-bold";
            } else {
                gpsStatus.innerText = `🚫 DI LUAR AREA (Jarak: ${Math.round(dist)}m)`;
                gpsStatus.className = "bg-red-600 text-white p-2 rounded-lg text-[10px] font-bold";
            }
        }
    }, (err) => {
        let msg = "GPS MATI";
        if (err.code === 1) msg = "IZINKAN LOKASI DI BROWSER!";
        gpsStatus.innerText = "🚫 " + msg;
        gpsStatus.className = "bg-red-700 text-white p-2 rounded-lg text-[10px] font-bold";
    }, { 
        enableHighAccuracy: true, // WAJIB TRUE untuk geofencing
        timeout: 10000, 
        maximumAge: 0 
    });
}

// 3. SATU FUNGSI DETEKSI WAJAH YANG SOLID
async function initFaceDetection() {
    video.onplay = () => {
        const canvas = faceapi.createCanvasFromMedia(video);
        const container = document.querySelector('.video-container');
        container.append(canvas);
        const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
        faceapi.matchDimensions(canvas, displaySize);

        let lastProcessTime = 0; // Untuk throttling

        const runDetection = async (now) => {
            // Berhenti jika tab tidak aktif atau video mati
            if (document.hidden || currentTab !== 'absensi' || video.paused || video.ended) {
                requestAnimationFrame(runDetection);
                return;
            }

            // HANYA JALANKAN SETIAP 500ms (0.5 detik)
            if (now - lastProcessTime > 500) {
                lastProcessTime = now;

                const detection = await faceapi.detectSingleFace(video, faceOptions)
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (detection && isLocationValid && faceMatcher) {
                    const resized = faceapi.resizeResults(detection, displaySize);
                    
                    // Liveness Check: Gerakan wajah minimal
                    const nose = detection.landmarks.getNose()[3]; 
                    const movement = Math.abs(nose.x - lastX) + Math.abs(nose.y - lastY);
                    const isAlive = movement > 0.3 && movement < 15; 
                    lastX = nose.x; lastY = nose.y;

                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (match.label !== 'unknown' && match.distance < 0.45 && isAlive) {
                        if (!isProcessing) {
                            isProcessing = true;
                            await recordAttendance(match.label);
                            // Jeda 5 detik sebelum bisa absen orang berikutnya
                            setTimeout(() => { isProcessing = false; }, 5000); 
                        }
                        ctx.strokeStyle = '#10b981'; // Hijau jika dikenal
                    } else {
                        ctx.strokeStyle = '#3b82f6'; // Biru jika mencari
                    }
                    // Gambar kotak tipis saja agar tidak mengganggu pandangan
                    ctx.lineWidth = 2;
                    ctx.strokeRect(resized.detection.box.x, resized.detection.box.y, resized.detection.box.width, resized.detection.box.height);
                }
            }
            requestAnimationFrame(runDetection);
        };
        requestAnimationFrame(runDetection);
    };
}

// 4. PERBAIKAN FUNGSI REGISTER (UPDATE DEXIE SECARA INSTAN)
async function registerFace() {
    const nama = document.getElementById('reg-siswa').value;
    const kelas = document.getElementById('reg-kelas').value;
    
    if (!nama) {
        showToast("Pilih nama siswa dulu!", "error");
        return;
    }

    if (!confirm(`Daftarkan wajah ${nama}? Data lama (jika ada) akan ditimpa.`)) return;

    const regStatus = document.getElementById('reg-status');
    regStatus.innerText = "⏳ MEMINDAI... JANGAN BERGERAK";

    try {
        // Gunakan detektor yang lebih akurat khusus pendaftaran
        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320 }))
            .withFaceLandmarks()
            .withFaceDescriptor();

        if (!detection) throw new Error("Wajah tidak jelas, coba lagi.");

        const nisSiswa = siswaData.find(s => s.nama === nama)?.nis;
        const descriptorArray = Array.from(detection.descriptor);
        
        await db.collection("artifacts").doc(APP_PATH)
            .collection("public").doc("biometrics")
            .collection("face_data").doc(nisSiswa).set({
                nis: nisSiswa, nama, kelas,
                descriptor: JSON.stringify(descriptorArray),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

        // Update database lokal saat itu juga
        await localDB.faces.put({ nis: nisSiswa, nama, kelas, descriptor: descriptorArray });

        showToast("REGISTRASI BERHASIL", "success");
        regStatus.innerText = "✅ SELESAI";
        
        // Refresh matcher agar siswa bisa langsung absen
        await syncFaceDatabase(); 

    } catch (e) {
        showToast(e.message, "error");
        regStatus.innerText = "❌ GAGAL";
    }
}

// ================== LOGIKA ABSENSI TERINTEGRASI (VERSI TEROPTIMASI) ==================
async function recordAttendance(nis) {
    const now = new Date();
    const siswa = siswaData.find(s => s.nis === nis);
    
    // 1. Validasi & Cooldown (Cegah absensi ganda dalam 1 menit)
    if (!siswa) return;
    if (lastAttendance[nis] && (Date.now() - lastAttendance[nis] < 60000)) {
        console.log(`Menunggu cooldown untuk: ${siswa.nama}`);
        return;
    }
    
    const type = document.querySelector('input[name="absensi-type"]:checked').value;
    const tgl = now.toISOString().split('T')[0];
    const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    // Payload data untuk dikirim
    const data = {
        nama: siswa.nama, 
        nis: siswa.nis, 
        kelas: siswa.kelas,
        type: type, 
        waktu: waktu,
        tanggal: tgl,
        timestamp: firebase.firestore.FieldValue.serverTimestamp() // Waktu Server Anti-Cheat
    };

    // Feedback Visual: Ubah warna siluet & animasi
    const silhouette = document.getElementById('face-silhouette-svg');
    if (silhouette) {
        silhouette.classList.remove('text-white/30');
        silhouette.classList.add('text-green-500', 'scale-110');
    }

    try {
        // A. SIMPAN KE FIRESTORE
        const docRef = db.collection("artifacts").doc(APP_PATH)
                         .collection("public").doc("records")
                         .collection(tgl).doc(nis);

        const updateData = { ...data };
        // Mencatat waktu spesifik masuk/pulang dalam format ISO
        if (type === "Masuk") {
            updateData.masuk = now.toISOString();
        } else {
            updateData.pulang = now.toISOString();
        }

        await docRef.set(updateData, { merge: true });
        addLog(`✅ Firestore: ${siswa.nama} (${type})`);

        // B. KIRIM KE GOOGLE SHEETS (Via Backend Apps Script)
        if (settings.endpointUrl) {
            // Mode 'no-cors' penting agar fetch tidak di-block oleh browser
            fetch(settings.endpointUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                addLog(`🚀 Spreadsheet: Data terkirim.`);
            }).catch(err => {
                addLog(`⚠️ Spreadsheet Gagal: ${err.message}`);
            });
        }
        
        // Munculkan notifikasi sukses
        if (typeof showToast === "function") {
            showToast(`${type} Berhasil: ${siswa.nama}`, "success");
        }

    } catch (e) {
        // C. BACKUP OFFLINE (Jika internet terputus)
        addLog(`⚠️ Offline: Tersimpan lokal.`);
        let offlineData = JSON.parse(localStorage.getItem('offline_logs') || "[]");
        offlineData.push({...data, isSync: false, error: e.message});
        localStorage.setItem('offline_logs', JSON.stringify(offlineData));
    } finally {
        // Kembalikan efek visual siluet setelah 2 detik
        setTimeout(() => {
            if (silhouette) {
                silhouette.classList.remove('text-green-500', 'scale-110');
                silhouette.classList.add('text-white/30');
            }
        }, 2000);
    }
    
    // Update cooldown & Suara
    lastAttendance[nis] = Date.now();
    speak(`${siswa.nama} ${type}`);
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3; // Radius bumi dalam meter
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + 
              Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * 
              Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// ================== DATA SISWA ==================
async function fetchSiswa() {
    const url = document.getElementById('csv-url').value;
    if (!url) return alert("Silahkan masukkan URL CSV!");
    addLog("⏳ Menghubungkan ke database CSV...");
    try {
        const res = await fetch(url);
        const text = await res.text();
        const rows = text.split(/\r?\n/).filter(r => r.trim() !== "");
        siswaData = rows.slice(1).map(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            return {
                nis: cols[0]?.replace(/"/g, '').trim(),
                nama: cols[1]?.replace(/"/g, '').trim(),
                kelas: cols[2]?.replace(/"/g, '').trim(),
                sesi: cols[3]?.replace(/"/g, '').trim()
            };
        });

        const kelasUnik = [...new Set(siswaData.map(s => s.kelas))].filter(k => k).sort();
        const filterLaporan = document.getElementById('filter-kelas-laporan');
        if (filterLaporan) {
            filterLaporan.innerHTML = '<option value="SEMUA">Semua Kelas</option>' +
                kelasUnik.map(k => `<option value="${k}">${k}</option>`).join('');
        }

        // Update Dropdown Registrasi
        const regKelas = document.getElementById('reg-kelas');
        if (regKelas) {
            regKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
                kelasUnik.map(k => `<option value="${k}">${k}</option>`).join('');
        }

        addLog(`✅ Berhasil: ${siswaData.length} siswa dimuat.`);
    } catch (e) {
        addLog("❌ Gagal Sinkron: " + e.message);
    }
}

// ================== LAPORAN ==================
function loadLaporan() {
    const today = new Date().toISOString().split('T')[0];
    const filterKelas = document.getElementById('filter-kelas-laporan').value;
    db.collection("artifacts").doc(APP_PATH)
      .collection("public").doc("records")
      .collection(today).onSnapshot(snapshot => {
        const container = document.getElementById('laporan-list');
        container.innerHTML = "";
        if (snapshot.empty) {
            container.innerHTML = "<div class='text-center py-10 text-gray-400'>Belum ada data absensi hari ini.</div>";
            return;
        }
        snapshot.forEach(doc => {
            const item = doc.data();
            if (filterKelas !== "SEMUA" && item.kelas !== filterKelas) return;
            const div = document.createElement('div');
            div.className = "flex justify-between items-center p-4 bg-gray-50 dark:bg-slate-800/50 rounded-xl border border-gray-100 dark:border-slate-800";
            div.innerHTML = `
                <div>
                    <div class="font-bold text-slate-900 dark:text-white">${item.nama}</div>
                    <div class="text-[10px] text-gray-500 uppercase">${item.nis} • ${item.kelas}</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] font-bold ${item.masuk ? 'text-green-500' : 'text-gray-400'}">MASUK: ${item.masuk ? new Date(item.masuk).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--'}</div>
                    <div class="text-[10px] font-bold ${item.pulang ? 'text-red-500' : 'text-gray-400'}">PULANG: ${item.pulang ? new Date(item.pulang).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--'}</div>
                </div>
            `;
            container.appendChild(div);
        });
    });
}

function exportLaporan() {
    const today = new Date().toISOString().split('T')[0];
    addLog("⏳ Menyiapkan file laporan...");
    db.collection("artifacts").doc(APP_PATH)
      .collection("public").doc("records")
      .collection(today).get().then(snapshot => {
        if (snapshot.empty) return alert("Tidak ada data untuk diunduh hari ini.");

        let csv = "NIS,Nama,Kelas,Jam Masuk,Jam Pulang\n";
        snapshot.forEach(doc => {
            const d = doc.data();
            const jamMasuk = d.masuk ? new Date(d.masuk).toLocaleTimeString() : "-";
            const jamPulang = d.pulang ? new Date(d.pulang).toLocaleTimeString() : "-";
            csv += `"${d.nis}","${d.nama}","${d.kelas}","${jamMasuk}","${jamPulang}"\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Rekap_Absensi_${today}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        addLog("✅ Laporan berhasil diunduh.");
    }).catch(err => alert("Gagal ekspor: " + err.message));
}
